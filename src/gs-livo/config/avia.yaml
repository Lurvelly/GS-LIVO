common:
  img_topic: "/left_camera/image"
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  extrinsic_T: [0.04165, 0.02326, -0.0284]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  # Rcl: [0.00610193,-0.999863,-0.0154172,
  #       -0.00615449,0.0153796,-0.999863,
  #       0.999962,0.00619598,-0.0060598] 
  # Pcl: [0.0194384, 0.104689,-0.0251952]

  Rcl: [0.00610193,-0.999863,-0.0154172,
      -0.00615449,0.0153796,-0.999863,
        0.999962,0.00619598,-0.0060598] 
  Pcl: [0.0194384, 0.104689,-0.0251952]


time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.1
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 1 # Livox Avia LiDAR
  scan_line: 6
  blind: 0.8

vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000 
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1
  max_update_rot_deg: 5.0
  max_update_trans: 0.5
  max_update_vel: 10.0

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5 # 0.2
  gyr_cov: 0.3 # 0.5
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1
  max_prop_rot_deg: 20.0
  max_prop_trans: 3.0
  max_prop_vel: 30.0

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025 # 0.005
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]
  min_effective_features: 10
  max_update_rot_deg: 5.0
  max_update_trans: 1.0
  max_update_vel: 10.0

local_map:  
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false 
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "CBD_Building_01"
  pose_output_en: false

pcd_save:
  pcd_save_en: false
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.15
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.



gs:
  voxel_size: 1.0
  border_gs: 4
  normal_rejecter: 0.0
  white_background: false
  # Saving every rendered/GT image is useful for debugging but too slow for normal odometry.
  save_results: false
  save_rendered_images: false
  save_gt_images: false
  # Preserve the original FAST-LIVO sparse visual update while GS runs as a
  # mapping/rendering side path. Disable only when testing pure GS tracking.
  sparse_vio_fallback: true
  # Enable the paper-style GS photometric EKF path only after the Gaussian map is mature.
  # The gates below keep unstable rendered residuals from perturbing the main LIO/VIO state.
  pose_update: true
  pose_update_start_frame: 80
  pose_update_min_gaussians: 5000
  pose_update_min_points: 120
  pose_update_min_measurements: 1500
  pose_update_max_rmse: 35.0
  # Clamp plausible but too-large raw GS pose steps into small state updates.
  pose_update_step_damping: 0.5
  pose_update_max_raw_rot_deg: 1.0
  pose_update_max_raw_trans: 0.1
  max_pose_update_rot_deg: 0.05
  max_pose_update_trans: 0.005
  render_jacobian: true
  # GS render and current image are same-frame quantities; keep exposure out by default.
  pose_update_exposure: false
  # Finite-difference pose Jacobian performs 7 extra renders per EKF iteration.
  # Keep it off for real-time runs; enable only for small-window Jacobian debugging.
  pose_finite_diff_jacobian: false
  pose_fd_rot_eps: 0.0001
  pose_fd_trans_eps: 0.001
  pose_fd_max_gaussians: 3000
  save_map_interval: 20
  # Limit new GS initialization per image frame; <=0 disables this throttle.
  max_insert_gaussians: 3000
  # Limit global density per GS root voxel; <=0 disables this density gate.
  max_points_per_voxel: 300
  # 0 keeps all in-frame GS candidates; positive caps keep rendering bounded.
  max_render_gaussians: 12000
  # Query neighboring GS root voxels around LiDAR-triggered cells to mimic a
  # sliding active Gaussian window while keeping lookup bounded.
  active_voxel_radius: 1
  max_seed_voxels: 2000
  max_active_voxels: 3000
  # Bound the persistent GS map for long UAV runs; farthest root voxels are
  # removed when either limit is exceeded. <=0 disables each gate.
  max_map_voxels: 8000
  max_total_gaussians: 1200000
  prune_interval_frames: 10
  prune_submap_threshold: 20000
  output_dir: "Log/GS"
  plot_gs_render: 0
  gs_iterations: 4
  gs_position_lr: 0.01
  gs_feature_lr: 0.01
  gs_opacity_lr: 0.1
  gs_scaling_lr: 1.8
  gs_rotation_lr: 0.01

scale_factor: 0.035
GS_voxel_size: 1.0
root_voxel_size: 0.01
octree_max_level: 3
